name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 ruff
        run: pip install 'ruff>=0.8,<1'
      - name: Lint
        run: ruff check lib tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 校验 + 全量自测
        run: npm test
      - name: pytest 收集(结构化测试层)
        run: python3 -m pytest tests/ -q
      - name: 端到端演示
        run: npm run demo
