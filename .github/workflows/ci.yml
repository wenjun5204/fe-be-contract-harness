name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: 安装依赖
        run: |
          pip install pyyaml
          pip install pytest
      - name: 校验 + 全量自测
        run: npm test
      - name: pytest 收集(结构化测试层)
        run: python3 -m pytest tests/ -q
      - name: 端到端演示
        run: npm run demo
